name: Select random tag and post it on Twitter

on:
  workflow_dispatch:
  schedule:
    - cron: '32 */4 * * *' # Run every 4 hours at minute 32

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:

      - name: checkout repo content
        uses: actions/checkout@v7 # Checkout the repo content so the runner can access the tags.py file

      - name: setup python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12' # install the python version needed
          
      - name: install python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: execute py script # Main.py program itself
        env:
          BSKY_HANDLE: ${{secrets.BSKY_HANDLE}}
          BSKY_PASSWORD: ${{secrets.BSKY_PASSWORD}}
          Authorization: ${{ secrets.Authorization }}
          auth_token: ${{ secrets.auth_token }}
        run: python main.py
